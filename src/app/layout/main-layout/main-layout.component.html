<div class="flex h-screen overflow-hidden">

    <!-- Mobile Backdrop -->
    @if (sidebarOpen) {
        <button
            class="fixed inset-0 z-40 bg-black/40 lg:hidden"
            type="button"
            aria-label="Close navigation menu"
            (click)="closeSidebar()">
        </button>
    }

    <!-- Sidebar -->
    <app-sidebar
        class="fixed inset-y-0 left-0 z-50 transition-transform duration-300 ease-in-out lg:static lg:z-auto lg:translate-x-0"
        [class.-translate-x-full]="!sidebarOpen"
        [class.translate-x-0]="sidebarOpen"
        (navigationSelected)="closeSidebar()">
    </app-sidebar>

    <!-- Main area -->
    <div class="flex min-w-0 flex-1 flex-col">

        <!-- Header -->
        <app-header (menuClicked)="toggleSidebar()">
        </app-header>

        <!-- Routed page content -->
        <main class="min-h-0 flex-1 overflow-y-auto bg-stone-100 p-4 sm:p-6">
            <router-outlet></router-outlet>
        </main>

    </div>

</div>
