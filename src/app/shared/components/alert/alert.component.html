@if (show && message) {
    <div
        role="alert"
        class="w-full px-4 py-3 gap-3 flex items-center rounded-full border text-sm font-medium animate-alert-enter"
        [ngClass]="{
            'border-red-300 bg-red-50 text-red-700': type === 'error',
            'border-green-300 bg-green-50 text-green-700': type === 'success',
            'border-yellow-300 bg-yellow-50 text-yellow-700': type === 'warning',
            'border-blue-300 bg-blue-50 text-blue-700': type === 'info'
        }">

        <!-- Alert icon -->
        @if (showIcon) {
            <mat-icon
                class="shrink-0"
                aria-hidden="true">
                {{ icon }}
            </mat-icon>
        }

        <!-- Alert message -->
        <span class="leading-5">
            {{ message }}
        </span>

    </div>
}
