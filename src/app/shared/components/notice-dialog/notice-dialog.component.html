<div class="flex w-full max-h-[90vh] flex-col bg-white p-6 sm:p-8">

    <!-- Icon -->
    <div class="mb-4 flex size-12 shrink-0 items-center justify-center rounded-full bg-stone-100 text-stone-700">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
            <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm10.5-4.5a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm0 3.75a.75.75 0 0 0-1.5 0v5.25a.75.75 0 0 0 1.5 0v-5.25Z" clip-rule="evenodd" />
        </svg>
    </div>

    <!-- Header -->
    <div class="flex shrink-0 flex-col gap-2 border-b border-stone-300 pb-5">
        <h2 class="text-xl font-semibold">
            {{ data.title }}
        </h2>
        @if (data.description) {
            <p class="text-sm leading-6">
                {{ data.description }}
            </p>
        }
    </div>

    <!-- Scrollable Content -->
    @if (data.items?.length) {
        <div class="min-h-0 flex-1 overflow-y-auto py-5 pr-2">
            <div class="flex flex-col gap-4">
                @for (item of data.items; track item) {
                    <div class="flex items-start gap-3">
                        <div class="mt-2 size-2 shrink-0 rounded-full bg-stone-500">
                        </div>
                        <p class="text-sm leading-6 text-stone-600">
                            {{ item }}
                        </p>
                    </div>
                }
            </div>
        </div>
    }

    <!-- Actions -->
    <div class="flex shrink-0 justify-end border-t border-stone-300 pt-5">
        <button
            type="button"
            class="rounded-lg bg-stone-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-stone-700"
            (click)="confirm()">
            {{ data.confirmLabel ?? 'I Understand' }}
        </button>
    </div>

</div>
